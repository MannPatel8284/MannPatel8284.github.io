<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mann Patel | Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #fafbfc;
      --card: #ffffff;
      --text: #1a1d23;
      --muted: #5c6370;
      --accent: #2563eb;
      --accent-soft: #eff6ff;
      --border: #e5e7eb;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(0,0,0,0.06);
      --shadow-lg: 0 10px 40px rgba(0,0,0,0.08);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: 'DM Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    a { color: inherit; text-decoration: none; }
    .app { max-width: 720px; margin: 0 auto; padding: 0 24px 48px; }
    .nav {
      padding: 20px 0;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .nav-brand { font-family: 'Instrument Serif', serif; font-size: 22px; font-weight: 400; color: var(--text); }
    .nav-links { display: flex; gap: 24px; font-size: 14px; font-weight: 500; color: var(--muted); }
    .nav-links a:hover { color: var(--accent); }
    .hero {
      padding: 56px 0 48px;
      text-align: center;
    }
    .hero-pill {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .hero-title {
      font-family: 'Instrument Serif', serif;
      font-size: 42px;
      font-weight: 400;
      line-height: 1.2;
      margin: 0 0 16px;
      color: var(--text);
    }
    .hero-title span { color: var(--accent); }
    .hero-subtitle {
      font-size: 17px;
      color: var(--muted);
      max-width: 480px;
      margin: 0 auto 28px;
    }
    .hero-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn-primary, .btn-ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      box-shadow: var(--shadow);
    }
    .btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,0.35); }
    .btn-ghost {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-resume {
      background: #0f172a;
      color: #fff;
      border: none;
    }
    .btn-resume:hover { background: #1e293b; transform: translateY(-1px); }
    .section { padding: 40px 0 0; }
    .section-title {
      font-family: 'Instrument Serif', serif;
      font-size: 28px;
      font-weight: 400;
      margin: 0 0 8px;
      color: var(--text);
    }
    .section-subtitle { font-size: 15px; color: var(--muted); margin: 0 0 24px; }
    .skills-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .skill-pill {
      padding: 8px 16px;
      border-radius: var(--radius);
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      box-shadow: var(--shadow);
    }
    .projects-grid { display: flex; flex-direction: column; gap: 20px; }
    .project-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .project-card:hover { box-shadow: var(--shadow-lg); border-color: #c7d2fe; }
    .project-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .project-title { font-size: 18px; font-weight: 600; margin: 0 0 8px; color: var(--text); }
    .project-desc { font-size: 14px; color: var(--muted); margin: 0 0 12px; }
    .project-list { margin: 0 0 16px 20px; padding: 0; font-size: 14px; color: var(--muted); }
    .project-list li { margin-bottom: 4px; }
    .project-meta { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
    .project-tech { font-size: 12px; color: var(--muted); }
    .project-link { font-size: 13px; font-weight: 600; color: var(--accent); }
    .project-link:hover { text-decoration: underline; }
    .edu-card, .contact-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }
    .edu-card h3, .contact-card h3 { font-size: 16px; font-weight: 600; margin: 0 0 8px; }
    .contact-card p { margin: 0 0 8px; font-size: 15px; }
    .contact-card a { color: var(--accent); font-weight: 500; }
    .contact-card a:hover { text-decoration: underline; }
    .resume-download {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding: 12px 20px;
      background: var(--accent);
      color: #fff;
      border-radius: var(--radius);
      font-weight: 600;
      font-size: 14px;
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
    }
    .resume-download:hover { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,0.35); }
    .footer { padding: 32px 0 24px; text-align: center; font-size: 13px; color: var(--muted); border-top: 1px solid var(--border); margin-top: 40px; }
    @media (max-width: 600px) {
      .hero-title { font-size: 32px; }
      .nav-links { gap: 16px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    function Hero() {
      return (
        <section className="hero">
          <p className="hero-pill">AI · ML · Fullstack</p>
          <h1 className="hero-title">Hi, I'm <span>Mann Patel</span></h1>
          <p className="hero-subtitle">
           I build software that solves problems that actually exist. My current project ShelfEye uses computer vision and machine learning to track where shoppers look in retail stores through their existing cameras — no expensive hardware, no privacy violations, just intelligence. Strong in Python, ML, computer vision, and full-stack development across Flask, React, and AWS. Currently a Computer Science student who prefers shipping real products over writing academic reports.
          </p>
          <div className="hero-actions">
            <a href="#projects" className="btn-primary">View Projects</a>
            <a href="resume.pdf" target="_blank" rel="noopener noreferrer" className="btn-resume btn-primary">Resume</a>
            <a href="https://github.com/MannPatel8284" target="_blank" rel="noreferrer" className="btn-ghost">GitHub</a>
          </div>
        </section>
      );
    }

    function Skills() {
      const skills = [
        'Python', 'C++', 'Java', 'Machine Learning', 'OpenCV', 'MediaPipe',
        'Flask', 'React', 'PyQt6', 'SQL / MySQL', 'SQLite', 'Data Structures',
        'OOP', 'Git & GitHub'
      ];
      return (
        <section id="skills" className="section">
          <h2 className="section-title">Skills</h2>
          <p className="section-subtitle">Technologies and tools I work with.</p>
          <div className="skills-grid">
            {skills.map(s => <div key={s} className="skill-pill">{s}</div>)}
          </div>
        </section>
      );
    }

    function ProjectCard({ title, badge, description, bullets, tech, link }) {
      return (
        <article className="project-card">
          <span className="project-badge">{badge}</span>
          <h3 className="project-title">{title}</h3>
          <p className="project-desc">{description}</p>
          <ul className="project-list">
            {bullets.map(b => <li key={b}>{b}</li>)}
          </ul>
          <div className="project-meta">
            <span className="project-tech">{tech}</span>
            {link && <a href={link} target="_blank" rel="noreferrer" className="project-link">View code →</a>}
          </div>
        </article>
      );
    }

    function Projects() {
      const projects = [
        {
          title: 'ShelfEye — Retail Attention Intelligence',
          badge: 'Featured · Computer Vision + React',
          description: 'Software-only in-store analytics: tracks where shoppers look and how long they look using a camera and head-pose estimation. No new hardware — stores use existing cameras.',
          bullets: [
            '9 shelf zones (3 aisles × 3 heights); classifies engagement as glance, browse, or dwell.',
            'Python + OpenCV + MediaPipe pipeline; Flask API; React dashboard with heatmap and live stats.',
          ],
          tech: 'Python, OpenCV, MediaPipe, Flask, React, Chart.js',
          link: 'https://github.com/MannPatel8284/shelfeye',
        },
        {
          title: 'Motion Detection Security System',
          badge: 'Computer Vision',
          description: 'Event-based security camera with recording and email alerts on motion.',
          bullets: [
            'Real-time motion detection and region-based recording using OpenCV.',
            'Email alerts with recorded video clips.',
          ],
          tech: 'Python, OpenCV, SMTP',
          link: null,
        },
        {
          title: 'Student Management System',
          badge: 'Desktop App',
          description: 'GUI desktop app for student records with full CRUD and persistent storage.',
          bullets: [
            'PyQt6 interface; SQLite database.',
          ],
          tech: 'Python, PyQt6, SQLite',
          link: null,
        },
      ];
      return (
        <section id="projects" className="section">
          <h2 className="section-title">Projects</h2>
          <p className="section-subtitle">Things I've built and shipped.</p>
          <div className="projects-grid">
            {projects.map(p => <ProjectCard key={p.title} {...p} />)}
          </div>
        </section>
      );
    }

    function Education() {
      return (
        <section id="education" className="section">
          <h2 className="section-title">Education</h2>
          <div className="edu-card">
            <h3>B.Sc. Computer Science</h3>
            <p>Expected graduation: 2028</p>
          </div>
        </section>
      );
    }

    function Contact() {
      return (
        <section id="contact" className="section">
          <h2 className="section-title">Contact</h2>
          <p className="section-subtitle">Open to internships and opportunities.</p>
          <div className="contact-card">
            <p><strong>Email</strong> · <a href="mailto:patelmann274@gmail.com">patelmann274@gmail.com</a></p>
            <p><strong>GitHub</strong> · <a href="https://github.com/MannPatel8284" target="_blank" rel="noreferrer">github.com/MannPatel8284</a></p>
            <a href="resume.pdf" target="_blank" rel="noopener noreferrer" className="resume-download">📄 Download my resume (PDF)</a>
          </div>
        </section>
      );
    }

    function App() {
      return (
        <div className="app">
          <header className="nav">
            <span className="nav-brand">Mann Patel</span>
            <nav className="nav-links">
              <a href="#projects">Projects</a>
              <a href="#skills">Skills</a>
              <a href="#education">Education</a>
              <a href="#contact">Contact</a>
              <a href="resume.pdf" target="_blank" rel="noopener noreferrer">Resume</a>
            </nav>
          </header>
          <main>
            <Hero />
            <Projects />
            <Skills />
            <Education />
            <Contact />
          </main>
          <footer className="footer">
            © {new Date().getFullYear()} Mann Patel 
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
